<!DOCTYPE html>
<html lang="en">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Evening Classes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadAdminDashboard()">

<div class="header">
     <img src="logo.png" alt="School Logo" class="header-logo">

    <div>
    <h2>EVENING CLASSES</h2>
    <p>Admin Dashboard</p>
</div>

<div class="nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="manage-staff.html">Manage Staff</a>
    <a href="manage-subjects.html">Manage Subjects</a>
    <a href="submissions.html">Teaching Submissions</a>
    <a href="reports.html">Reports</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="container">

    <h2>Welcome, Administrator</h2>

    <div class="dashboard-cards">

        <div class="card">
            <h3>Total Staff</h3>
            <h1 id="staffCount">0</h1>
        </div>

        <div class="card">
            <h3>Total Subjects</h3>
            <h1 id="subjectCount">0</h1>
        </div>

        <div class="card">
            <h3>Total Submissions</h3>
            <h1 id="submissionCount">0</h1>
        </div>

        <div class="card">
            <h3>Pending Approval</h3>
            <h1 id="pendingCount">0</h1>
        </div>

    </div>

    <div class="section-box">

        <h2>Administration Menu</h2>

        <div class="admin-buttons">

            <a href="manage-staff.html" class="big-button">
                Manage Staff
            </a>

            <a href="manage-subjects.html" class="big-button">
                Manage Subjects
            </a>

            <a href="submissions.html" class="big-button">
                Teaching Submissions
            </a>

            <a href="reports.html" class="big-button">
                Activity Reports
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
