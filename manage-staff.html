<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff - Evening Classes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadStaff()">

<div class="header">
    <h2>EVENING CLASSES</h2>
    <p>Staff Management</p>
</div>

<div class="nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="manage-staff.html">Manage Staff</a>
    <a href="manage-subjects.html">Manage Subjects</a>
    <a href="submissions.html">Teaching Submissions</a>
    <a href="reports.html">Reports</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="container">

    <div class="section-box">

        <h2>Add Staff Member</h2>

        <input type="hidden" id="staffEditIndex">

        <div class="form-group">
            <label>Staff Name</label>
            <input type="text" id="staffName" placeholder="Enter staff full name">
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="staffUsername" placeholder="Enter username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="staffPassword" placeholder="Enter password">
        </div>

        <button onclick="saveStaff()">Save Staff</button>

        <button class="secondary-btn" onclick="clearStaffForm()">
            Clear
        </button>

        <p id="staffMessage"></p>

    </div>

    <div class="section-box">

        <h2>Registered Staff</h2>

        <div class="table-responsive">

            <table>

                <thead>
                <tr>
                    <th>#</th>
                    <th>Staff Name</th>
                    <th>Username</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody id="staffTableBody"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
